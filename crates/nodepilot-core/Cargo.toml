[package]
name = "nodepilot-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
age = "0.11"
argon2 = "0.6.0"
base64 = "0.23.1"
bytes = "1.12.2"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
ipnet = "2.12.2"
nodepilot-ssh = { version = "0.1.0", path = "../nodepilot-ssh" }
object_store = { version = "0.14.2", features = ["aws"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
