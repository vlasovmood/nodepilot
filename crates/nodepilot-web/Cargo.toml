[package]
name = "nodepilot-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.2"
futures = "0.3.34"
mime_guess = "2.0.5"
nodepilot-core = { version = "0.1.0", path = "../nodepilot-core" }
nodepilot-mcp = { version = "0.1.0", path = "../nodepilot-mcp" }
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["serde"] }
